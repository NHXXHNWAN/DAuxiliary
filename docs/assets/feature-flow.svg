<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title"><title id="title">DAuxiliary 从配置到宿主 Hook 的流程</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10" fill="#72e2d0"/></marker></defs><rect width="1000" height="250" rx="24" fill="#171a33"/><text x="36" y="45" fill="#a99df3" font-size="18" font-family="sans-serif">CONFIGURATION → HOST PROCESS → HOOK</text><g fill="#292a50" stroke="#9285e5" stroke-width="2"><rect x="30" y="83" width="200" height="110" rx="18"/><rect x="277" y="83" width="200" height="110" rx="18"/><rect x="524" y="83" width="200" height="110" rx="18"/><rect x="771" y="83" width="200" height="110" rx="18"/></g><g fill="none" stroke="#72e2d0" stroke-width="3" marker-end="url(#arrow)"><path d="M235 138h34"/><path d="M482 138h34"/><path d="M729 138h34"/></g><g fill="#f4f1ff" font-family="sans-serif" font-size="21" text-anchor="middle"><text x="130" y="128">启用模块</text><text x="377" y="128">宿主识别</text><text x="624" y="128">设置与开关</text><text x="871" y="128">按需 Hook</text></g><g fill="#aaa4c8" font-family="sans-serif" font-size="15" text-anchor="middle"><text x="130" y="162">LSPosed scope</text><text x="377" y="162">QQ / 微信 / 抖音</text><text x="624" y="162">RemotePreferences</text><text x="871" y="162">DexKit · 失败跳过</text></g><text x="30" y="224" fill="#8d89ab" font-size="14" font-family="sans-serif">示意流程，不代表所有宿主功能已通过运行验证</text></svg>