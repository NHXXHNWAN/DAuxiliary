name: Build and Publish DAuxiliary

on:
  push:
    branches: ["Test"]
  pull_request:
    branches: ["Test"]
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes; leave empty to generate notes from commits"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD_SECRET: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS_SECRET: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD_SECRET: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD_SECRET" ] && [ -n "$RELEASE_KEY_ALIAS_SECRET" ] && [ -n "$RELEASE_KEY_PASSWORD_SECRET" ]; then
            # Accept wrapped Base64, URL-safe Base64, and omitted padding from clipboard tools.
            keystore_base64="$(printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | tr '_-' '/+')"
            if [[ ! "$keystore_base64" =~ ^[A-Za-z0-9+/]*={0,2}$ ]]; then
              echo "::error::RELEASE_KEYSTORE_BASE64 contains characters outside the Base64 alphabet. Recreate it directly from the .jks file."
              exit 1
            fi
            remainder=$((${#keystore_base64} % 4))
            if [ "$remainder" -eq 1 ]; then
              echo "::error::RELEASE_KEYSTORE_BASE64 has an invalid length. Replace the secret with the complete Base64 output."
              exit 1
            elif [ "$remainder" -eq 2 ]; then
              keystore_base64="${keystore_base64}=="
            elif [ "$remainder" -eq 3 ]; then
              keystore_base64="${keystore_base64}="
            fi
            keystore_file="$RUNNER_TEMP/dauxiliary-release.jks"
            if ! printf '%s' "$keystore_base64" | base64 --decode > "$keystore_file"; then
              echo "::error::RELEASE_KEYSTORE_BASE64 could not be decoded. Replace it with the complete Base64 output from the .jks file."
              exit 1
            fi
            if ! keytool -list -keystore "$keystore_file" -storepass "$RELEASE_STORE_PASSWORD_SECRET" >/dev/null 2>&1; then
              echo "::error::The decoded keystore cannot be opened. Check the Base64 value and RELEASE_STORE_PASSWORD."
              exit 1
            fi
            {
              echo "RELEASE_STORE_FILE=$keystore_file"
              echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD_SECRET"
              echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS_SECRET"
              echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD_SECRET"
            } >> "$GITHUB_ENV"
          else
            echo "Release signing secrets are not configured; generating a temporary CI key."
            echo "WARNING: This APK is suitable for CI/testing only. Configure repository Actions secrets for a stable installable release signature."
            store_password="$(openssl rand -hex 16)"
            keytool -genkeypair -storetype JKS -alias dauxiliary-ci -keyalg RSA -keysize 2048 \
              -validity 3650 -keystore "$RUNNER_TEMP/dauxiliary-release.jks" \
              -storepass "$store_password" -keypass "$store_password" \
              -dname "CN=DAuxiliary CI, OU=Development, O=DAuxiliary, C=CN" -noprompt
            {
              echo "RELEASE_STORE_FILE=$RUNNER_TEMP/dauxiliary-release.jks"
              echo "RELEASE_STORE_PASSWORD=$store_password"
              echo "RELEASE_KEY_ALIAS=dauxiliary-ci"
              echo "RELEASE_KEY_PASSWORD=$store_password"
            } >> "$GITHUB_ENV"
          fi

      - name: Generate release version
        id: release
        env:
          TZ: Asia/Shanghai
        run: |
          # versionName is the calendar date; versionCode is the date and minute.
          version_name="$(date '+%y.%-m.%-d')"
          version_code="$(date '+%Y%m%d%H%M')"
          short_sha="${GITHUB_SHA:0:7}"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "stable_tag=v$version_name" >> "$GITHUB_OUTPUT"
          echo "test_tag=test-$version_name-$short_sha" >> "$GITHUB_OUTPUT"
          echo "Generated version: $version_name (versionCode: $version_code)"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain -PversionName=${{ steps.release.outputs.version_name }} -PversionCode=${{ steps.release.outputs.version_code }}

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAuxiliary-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # Every push to Test publishes a prerelease consumed by the Test channel.
      # Manual runs additionally publish a stable release consumed by the Stable channel.
      - name: Publish Test prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/Test'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          release_tag="${{ steps.release.outputs.test_tag }}"
          notes_file="$RUNNER_TEMP/test-release-notes.md"
          message="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c1-80)"
          case "${message,,}" in
            feat:*|add:*|增加：*) note="增加：${message#*: }" ;;
            fix:*|修复：*) note="修复：${message#*: }" ;;
            perf:*|refactor:*|优化：*) note="优化：${message#*: }" ;;
            *) note="变更：$message" ;;
          esac
          printf '%s\n' "$note" > "$notes_file"
          gh release create "$release_tag" app/build/outputs/apk/release/*.apk \
            --prerelease \
            --title "DAuxiliary 测试版 ${{ steps.release.outputs.version_name }}" \
            --notes-file "$notes_file" \
            --target "$GITHUB_SHA"

      - name: Publish stable GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          release_tag="${{ steps.release.outputs.stable_tag }}"
          release_args=(
            "$release_tag"
            app/build/outputs/apk/release/*.apk
            --title "DAuxiliary v${{ steps.release.outputs.version_name }}"
            --target "$GITHUB_SHA"
          )
          if [ -n "$RELEASE_NOTES" ]; then
            printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
            gh release create "${release_args[@]}" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "${release_args[@]}" --generate-notes
          fi
