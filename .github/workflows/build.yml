name: Build and Publish DAuxiliary

on:
  push:
    branches: ["Test"]
  pull_request:
    branches: ["Test"]
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes; leave empty to generate notes from commits"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD_SECRET: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS_SECRET: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD_SECRET: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD_SECRET" ] && [ -n "$RELEASE_KEY_ALIAS_SECRET" ] && [ -n "$RELEASE_KEY_PASSWORD_SECRET" ]; then
            # Accept wrapped Base64, URL-safe Base64, and omitted padding from clipboard tools.
            keystore_base64="$(printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | tr '_-' '/+')"
            if [[ ! "$keystore_base64" =~ ^[A-Za-z0-9+/]*={0,2}$ ]]; then
              echo "::error::RELEASE_KEYSTORE_BASE64 contains characters outside the Base64 alphabet. Recreate it directly from the .jks file."
              exit 1
            fi
            remainder=$((${#keystore_base64} % 4))
            if [ "$remainder" -eq 1 ]; then
              echo "::error::RELEASE_KEYSTORE_BASE64 has an invalid length. Replace the secret with the complete Base64 output."
              exit 1
            elif [ "$remainder" -eq 2 ]; then
              keystore_base64="${keystore_base64}=="
            elif [ "$remainder" -eq 3 ]; then
              keystore_base64="${keystore_base64}="
            fi
            keystore_file="$RUNNER_TEMP/dauxiliary-release.jks"
            if ! printf '%s' "$keystore_base64" | base64 --decode > "$keystore_file"; then
              echo "::error::RELEASE_KEYSTORE_BASE64 could not be decoded. Replace it with the complete Base64 output from the .jks file."
              exit 1
            fi
            if ! keytool -list -keystore "$keystore_file" -storepass "$RELEASE_STORE_PASSWORD_SECRET" >/dev/null 2>&1; then
              echo "::error::The decoded keystore cannot be opened. Check the Base64 value and RELEASE_STORE_PASSWORD."
              exit 1
            fi
            {
              echo "RELEASE_STORE_FILE=$keystore_file"
              echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD_SECRET"
              echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS_SECRET"
              echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD_SECRET"
            } >> "$GITHUB_ENV"
          else
            echo "Release signing secrets are not configured; generating a temporary CI key."
            echo "WARNING: This APK is suitable for CI/testing only. Configure repository Actions secrets for a stable installable release signature."
            store_password="$(openssl rand -hex 16)"
            keytool -genkeypair -storetype JKS -alias dauxiliary-ci -keyalg RSA -keysize 2048 \
              -validity 3650 -keystore "$RUNNER_TEMP/dauxiliary-release.jks" \
              -storepass "$store_password" -keypass "$store_password" \
              -dname "CN=DAuxiliary CI, OU=Development, O=DAuxiliary, C=CN" -noprompt
            {
              echo "RELEASE_STORE_FILE=$RUNNER_TEMP/dauxiliary-release.jks"
              echo "RELEASE_STORE_PASSWORD=$store_password"
              echo "RELEASE_KEY_ALIAS=dauxiliary-ci"
              echo "RELEASE_KEY_PASSWORD=$store_password"
            } >> "$GITHUB_ENV"
          fi

      - name: Generate release version
        id: release
        env:
          TZ: Asia/Shanghai
        run: |
          # Both channels use the calendar version name; versionCode identifies each build.
          version_name="$(date '+%y.%-m.%-d')"
          test_version_name="${version_name}"
          # Keep versionCode within Android's signed Int range while changing every CI build.
          version_code="$(($(date '+%y%m%d') * 1000 + GITHUB_RUN_NUMBER))"
          short_sha="${GITHUB_SHA:0:7}"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "test_version_name=$test_version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "stable_tag=v$version_name" >> "$GITHUB_OUTPUT"
          echo "test_tag=test-$test_version_name-$short_sha" >> "$GITHUB_OUTPUT"
          echo "Generated version: stable=$version_name test=$test_version_name (versionCode: $version_code)"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain -PversionName=${{ github.event_name == 'push' && steps.release.outputs.test_version_name || steps.release.outputs.version_name }} -PversionCode=${{ steps.release.outputs.version_code }}

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: DAuxiliary-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare concise release notes
        id: notes
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          notes_file="$RUNNER_TEMP/dauxiliary-release-notes.md"
          if [ -n "$INPUT_NOTES" ]; then
            printf '%s\n' "$INPUT_NOTES" > "$notes_file"
          else
            base_sha="${{ github.event.before }}"
            if [ -n "$base_sha" ] && [ "$base_sha" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              commits="$(git log --pretty=%s "${base_sha}..${GITHUB_SHA}")"
            else
              echo "Previous commit $base_sha is unavailable in this checkout; collecting available commit subjects instead."
              commits="$(git log -n 12 --pretty=%s "${GITHUB_SHA}")"
            fi
            export RELEASE_COMMIT_SUBJECTS="$commits"
            python3 - <<'PY' > "$notes_file"
          import os
          import re

          commits = os.environ.get("RELEASE_COMMIT_SUBJECTS", "").splitlines()
          groups = {"增加": [], "修复": [], "优化": [], "变更": []}
          emoji = re.compile("[\\U0001F000-\\U0001FAFF\\u2600-\\u27BF]")
          for raw in commits:
              text = emoji.sub("", raw.strip())
              if not text:
                  continue
              match = re.match(r"^(feat|feature|add|新增|增加|fix|bug|修复|perf|refactor|optimize|优化)\\s*[:：]\\s*", text, re.I)
              prefix = match.group(1).lower() if match else ""
              if prefix in ("feat", "feature", "add", "新增", "增加"):
                  category = "增加"
              elif prefix in ("fix", "bug", "修复"):
                  category = "修复"
              elif prefix in ("perf", "refactor", "optimize", "优化"):
                  category = "优化"
              else:
                  category = "变更"
              if match:
                  text = text[match.end():]
              text = text.strip(" -:：")
              if text and text not in groups[category]:
                  groups[category].append(text[:100])
          for category in ("增加", "修复", "优化", "变更"):
              if groups[category]:
                  print(f"*{category}*")
                  for item in groups[category][:5]:
                      escaped = re.sub(r"([_\\*\\[\\]()~`>#+\\-=|{}.!])", r"\\\\\\1", item)
                      print(f"- {escaped}")
          PY
          fi
          if [ ! -s "$notes_file" ]; then
            printf '%s\n' '*变更*' '- 本次版本包含功能调整、问题修复和稳定性优化。' > "$notes_file"
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      # Every push to Test publishes a prerelease consumed by the Test channel.
      # Manual runs additionally publish a stable release consumed by the Stable channel.
      - name: Publish Test prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/Test'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          release_tag="${{ steps.release.outputs.test_tag }}"
          notes_file="${{ steps.notes.outputs.notes_file }}"
          printf '\n版本：%s\nversionCode：%s\n' "${{ steps.release.outputs.test_version_name }}" "${{ steps.release.outputs.version_code }}" >> "$notes_file"
          gh release create "$release_tag" app/build/outputs/apk/release/*.apk \
            --prerelease \
            --title "DAuxiliary 测试版 ${{ steps.release.outputs.test_version_name }}" \
            --notes-file "$notes_file" \
            --target "$GITHUB_SHA"

      - name: Publish stable GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          release_tag="${{ steps.release.outputs.stable_tag }}"
          release_args=(
            "$release_tag"
            app/build/outputs/apk/release/*.apk
            --title "DAuxiliary v${{ steps.release.outputs.version_name }}"
            --target "$GITHUB_SHA"
          )
          notes_file="${{ steps.notes.outputs.notes_file }}"
          if [ -n "$RELEASE_NOTES" ]; then
            printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          fi
          printf '\n版本：%s\nversionCode：%s\n' "${{ steps.release.outputs.version_name }}" "${{ steps.release.outputs.version_code }}" >> "$notes_file"
          gh release create "${release_args[@]}" --notes-file "$notes_file"

      - name: Send release APK to Telegram
        if: (github.event_name == 'push' && github.ref == 'refs/heads/Test') || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          TEST_TAG: ${{ steps.release.outputs.test_tag }}
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skip notification."
            exit 0
          fi

           apk_file=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
           if [ -z "$apk_file" ] || [ ! -f "$apk_file" ]; then
             echo "APK not found"
             find app/build/outputs/apk/release -maxdepth 2 -type f -print || true
             exit 1
           fi
           echo "Uploading APK: $apk_file"

          if [ "$EVENT_NAME" = "push" ]; then
            channel="测试版"
            release_tag="$TEST_TAG"
          else
            channel="正式版"
            release_tag="$STABLE_TAG"
          fi
          release_url="https://github.com/${REPOSITORY}/releases/tag/${release_tag}"

          notes=$(cat "$RELEASE_NOTES_FILE")
          notes=$(printf '%s' "$notes" | sed -E 's/[[:space:]]+$//' | head -c 600)
          export TELEGRAM_NOTES="$notes"
          export TELEGRAM_RELEASE_URL="$release_url"
          export TELEGRAM_CHANNEL="$channel"
          export TELEGRAM_VERSION_NAME="$VERSION_NAME"
          export TELEGRAM_VERSION_CODE="$VERSION_CODE"
          caption=$(python3 - <<'PY'
          import os
          import re
          notes = os.environ["TELEGRAM_NOTES"]
          channel = os.environ["TELEGRAM_CHANNEL"]
          version = os.environ["TELEGRAM_VERSION_NAME"]
          code = os.environ["TELEGRAM_VERSION_CODE"]
          url = os.environ["TELEGRAM_RELEASE_URL"]
          notes = re.sub(r"([_\\*\\[\\]()~`>#+\\-=|{}.!])", r"\\\\\\1", notes)
          url = url.replace(")", "\\\\)")
          print(f'*DAuxiliary {channel}*\\n版本：`{version}`\\nversionCode：`{code}`\\n\\n*更新内容*\\n{notes}\\n\\n[GitHub Release 下载页面]({url})')
          PY
          )

          response=$(curl --silent --show-error \
            --request POST \
            --form "chat_id=${TELEGRAM_CHAT_ID}" \
            --form "document=@${apk_file}" \
            --form "caption=${caption}" \
            --form "parse_mode=MarkdownV2" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument")
          if ! printf '%s' "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin); sys.exit(0 if data.get("ok") else 1)'; then
            echo "Telegram sendDocument failed: $response"
            exit 1
          fi
