name: Build and Publish DAuxiliary

on:
  push:
    branches: ["Test"]
    tags: ["v*"]
  pull_request:
    branches: ["Test"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ubuntu-latest provides the Android SDK used by this project.
      # Do not invoke sdkmanager because its package index may lack android-37.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DAuxiliary-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/apk/debug/*.apk \
            --title "DAuxiliary ${GITHUB_REF_NAME}" \
            --generate-notes
