name: Build and Publish DAuxiliary

on:
  push:
    branches: ["Test"]
    tags: ["v*"]
  pull_request:
    branches: ["Test"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD_SECRET: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS_SECRET: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD_SECRET: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD_SECRET" ] && [ -n "$RELEASE_KEY_ALIAS_SECRET" ] && [ -n "$RELEASE_KEY_PASSWORD_SECRET" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dauxiliary-release.jks"
            {
              echo "RELEASE_STORE_FILE=$RUNNER_TEMP/dauxiliary-release.jks"
              echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD_SECRET"
              echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS_SECRET"
              echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD_SECRET"
            } >> "$GITHUB_ENV"
          else
            echo "Release signing secrets are not configured; generating a temporary CI key."
            store_password="$(openssl rand -hex 16)"
            keytool -genkeypair -storetype JKS -alias dauxiliary-ci -keyalg RSA -keysize 2048 \
              -validity 3650 -keystore "$RUNNER_TEMP/dauxiliary-release.jks" \
              -storepass "$store_password" -keypass "$store_password" \
              -dname "CN=DAuxiliary CI, OU=Development, O=DAuxiliary, C=CN" -noprompt
            {
              echo "RELEASE_STORE_FILE=$RUNNER_TEMP/dauxiliary-release.jks"
              echo "RELEASE_STORE_PASSWORD=$store_password"
              echo "RELEASE_KEY_ALIAS=dauxiliary-ci"
              echo "RELEASE_KEY_PASSWORD=$store_password"
            } >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAuxiliary-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/*.apk \
            --title "DAuxiliary ${GITHUB_REF_NAME}" \
            --generate-notes
