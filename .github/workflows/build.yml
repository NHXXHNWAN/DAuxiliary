name: Build and Publish DAuxiliary

on:
  push:
    branches: ["Test"]
    tags: ["v*"]
  pull_request:
    branches: ["Test"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ubuntu-latest provides the Android SDK used by this project.
      # Do not invoke sdkmanager because its package index may lack android-37.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Create temporary CI signing key
        run: |
          store_password="$(openssl rand -hex 16)"
          key_password="$(openssl rand -hex 16)"
          keytool -genkeypair \
            -alias dauxiliary-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -keystore "$RUNNER_TEMP/dauxiliary-release.jks" \
            -storepass "$store_password" \
            -keypass "$key_password" \
            -dname "CN=DAuxiliary CI, OU=Development, O=DAuxiliary, C=CN" \
            -noprompt
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/dauxiliary-release.jks"
            echo "RELEASE_STORE_PASSWORD=$store_password"
            echo "RELEASE_KEY_ALIAS=dauxiliary-ci"
            echo "RELEASE_KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace --info 2>&1 | tee "$RUNNER_TEMP/debug-build.log"
      - name: Upload Kotlin build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-build-log-${{ github.sha }}
          path: ${{ runner.temp }}/debug-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DAuxiliary-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/apk/debug/*.apk \
            --title "DAuxiliary ${GITHUB_REF_NAME}" \
            --generate-notes
